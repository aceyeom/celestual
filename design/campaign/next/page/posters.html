<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>round, posters</title>
<script type="importmap">{ "imports": { "/repo/app/src/wall/scenes/kit.js": "/repo/design/campaign/next/page/kit-shim.js" } }</script>
<link rel="stylesheet" href="/repo/app/public/fonts/faces.css">
<style>
  /* the posters are 1080 by 1350 (4:5), drawn at the device's pixel ratio */
  html, body { margin: 0; background: #222; }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0A0A0A; }
  .poster > * { position: absolute; margin: 0; }
  canvas { display: block; }
  canvas.px { image-rendering: pixelated; }
</style>
<body>
<div id="poster" class="poster"></div>
<script type="module">
// A bench for round's posters: `?p=<name>` draws one poster into #poster for
// the harness to photograph at its pixel ratio.
const q = new URLSearchParams(location.search)
try {
  await document.fonts.load('56px "Jersey 10"')
  await document.fonts.load('24px "Geist Mono"')
  await document.fonts.load('500 80px Newsreader')
  if (q.has('p')) {
    const { POSTERS } = await import('./round-posters.js')
    await POSTERS[q.get('p')](document.getElementById('poster'), { dpr: window.devicePixelRatio })
  }
} catch (e) { console.error(e.stack || String(e)) }
window.__done = true
</script>
</body>
</html>
