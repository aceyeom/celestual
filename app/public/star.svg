<!-- CELESTUAL — the mark.

     A four-pointed star, cut down the middle, with a body sitting in the cut.
     It is ONE drawing used twice: the right wing is the star, the left wing is
     the same star turned a hundred and eighty degrees about the body, which is
     why it leans without ever having been drawn on a slant.

     The artwork is 1.212 times taller than it is wide and is drawn at exactly
     its own bounds — no margin, nothing trimmed off the long points. The
     VIEWPORT is then squared around it (the viewBox is widened by 10.6 either
     side rather than the geometry being moved), because every place this file
     is used is a square slot — a browser tab, a home-screen icon, a share
     preview — and a non-square favicon is one the platform squashes. Squaring
     the window instead of transforming the drawing also keeps every clip and
     mask coordinate below in the artwork's own space, where they can be read
     against the paths they cut.

     The rounded plate this used to be drawn on is gone. At sixteen pixels a
     plate is most of what you see, and what should be most of what you see is
     the mark.

     The cut between the halves and the crescent around the body are HOLES, not
     white paint. Whatever the mark is standing on shows through them, which is
     what lets one file serve a dark browser tab, an ivory print and the case. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10.6 0 121.2 121.2" role="img" aria-label="celestual">
  <defs>
    <clipPath id="l"><rect x="-30" y="-10" width="79.3" height="141.2"/></clipPath>
    <clipPath id="r"><rect x="50.7" y="-10" width="79.3" height="141.2"/></clipPath>
    <!-- the body: light off the top-left shoulder, deepening across the face. A
         struck disc, not a gradient swatch. -->
    <linearGradient id="b" x1="0.12" y1="0.02" x2="0.86" y2="1">
      <stop offset="0%" stop-color="#F2DCCC"/>
      <stop offset="52%" stop-color="#DCB39A"/>
      <stop offset="100%" stop-color="#BE8C71"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-30" y="-10" width="170" height="141.2">
      <rect x="-30" y="-10" width="170" height="141.2" fill="#fff"/>
      <!-- where the cut opens out around the body. It is only ever on the LEFT:
           the right wing runs straight up to the body's limb, and that single
           asymmetry is most of what stops the mark reading as a diagram of a
           planet. -->
      <circle cx="50" cy="60.6" r="14.1" fill="#000" clip-path="url(#l)"/>
    </mask>
  </defs>

  <g mask="url(#cut)">
    <!-- the left wing: the star, turned over -->
    <path clip-path="url(#l)" fill="#BFAAA1"
          d="M49.1 25.6Q54.01 61.6 98.2 65.6Q54.01 71.16 49.1 121.2Q44.19 71.16 0 65.6Q44.19 61.6 49.1 25.6Z"/>
    <!-- and the right -->
    <path clip-path="url(#r)" fill="#8D7169"
          d="M50.9 0Q55.81 50.04 100 55.6Q55.81 59.6 50.9 95.6Q45.99 59.6 1.8 55.6Q45.99 50.04 50.9 0Z"/>
  </g>
  <circle cx="50" cy="60.6" r="11.6" fill="url(#b)"/>
</svg>
