<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="facebook-domain-verification" content="6554rcyw9tzomsomxav3xy88iysvu2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The void (wall.css --void). One value, so the browser chrome, the page
         and the field behind it are all the same surface. -->
    <meta name="theme-color" content="#08070B" />

    <title>celestual</title>
    <meta
      name="description"
      content="place a ping on somebody. if they place one back, you are both told at once. if they do not, nobody is, and nobody ever knows there was anything to know."
    />

    <!-- Open Graph and the share preview. The image is a raster PNG at 1200x630
         because no scraper renders SVG, and a blank card silently kills the
         product's main growth surface, which is a link somebody sends to one
         other person. It is generated by scripts/export-og.mjs from the same
         mark, palette and faces as the page it links to, so the two cannot
         disagree. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="celestual" />
    <meta property="og:title" content="celestual" />
    <meta property="og:description" content="you both find out, or neither of you does." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="you both find out, or neither of you does." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="celestual" />
    <meta name="twitter:description" content="you both find out, or neither of you does." />
    <meta name="twitter:image" content="/og.png" />

    <!-- The mark, static, so the tab is right on the first paint of every
         address rather than after the wall's chunk has loaded and injected it.
         Generated by scripts/export-mark.mjs from the same geometry the app
         draws, so the drawing in the tab cannot drift from the one on screen. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- The faces are injected by whichever shell reads them: the wall and Main
         each load their own four from /fonts. Putting any of them here would mean
         every route paying for faces it does not use. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
