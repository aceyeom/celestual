<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="facebook-domain-verification" content="6554rcyw9tzomsomxav3xy88iysvu2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The black room (DESIGN.md 2.5): every address is the wall now, and
         the wall is #000. One value, so the browser chrome, the page and the
         room behind it are all the same surface. -->
    <meta name="theme-color" content="#000000" />
    <!-- The same black, inline, so the very first paint of a cold load is the
         room and never the browser's default or a colour from a stylesheet
         that has not arrived yet. -->
    <style>html { background: #000; }</style>

    <title>celestual</title>
    <meta name="description" content="anonymous letters to the people on your mind. find out if it's mutual." />

    <!-- Open Graph and the share preview: what a link to celestual.us unfurls
         into, which is how most people first see it. The image is a raster PNG
         at 1200x630 because no scraper renders SVG, and it is the product as
         it is: the black room, the intro's night screen with the pixel mark on
         it, and the lockup. It is generated by scripts/export-og.mjs from the
         screen's own stylesheet, the mark and the faces, so the card and the
         page cannot disagree. Its address is absolute, since a scraper does not
         always resolve a relative one against the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="celestual" />
    <meta property="og:url" content="https://celestual.us/" />
    <meta property="og:title" content="celestual" />
    <meta property="og:description" content="anonymous letters to the people on your mind. find out if it's mutual." />
    <meta property="og:image" content="https://celestual.us/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="a phone screen lit in a dark room with the celestual mark on it, beside the word celestual." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="celestual" />
    <meta name="twitter:description" content="anonymous letters to the people on your mind. find out if it's mutual." />
    <meta name="twitter:image" content="https://celestual.us/og.png" />
    <meta name="twitter:image:alt" content="a phone screen lit in a dark room with the celestual mark on it, beside the word celestual." />

    <!-- The mark, static, so the tab is right on the first paint of every
         address rather than after the wall's chunk has loaded and injected it.
         Generated by scripts/export-mark.mjs from the same geometry the app
         draws, so the drawing in the tab cannot drift from the one on screen. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- The faces are injected by whichever shell reads them: the wall and Main
         each load their own four from /fonts. Putting any of them here would mean
         every route paying for faces it does not use. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
