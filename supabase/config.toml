# Supabase CLI config for CELESTUAL.
# `project_id` is a local label; link to your cloud project with:
#   supabase link --project-ref <your-project-ref>
project_id = "celestual"

[db]
# Local dev database port (only used by `supabase start`).
port = 54322
major_version = 15

# Edge functions are invoked by anonymous visitors (with the project's anon key),
# so JWT verification is disabled; each function enforces its own checks.
[functions.celestual-notify]
verify_jwt = false

[functions.celestual-remind]
verify_jwt = false

[functions.celestual-search]
verify_jwt = false

# Called by Meta's webhook (not our clients), so JWT verification is off; the
# function enforces its own X-Hub-Signature-256 check instead.
[functions.celestual-ig-webhook]
verify_jwt = false

# Called by ManyChat's External Request (the no-Meta-portal path), authenticated by
# a shared secret instead of a JWT.
[functions.celestual-manychat]
verify_jwt = false

# The push half of the mutual reveal (migration 0023, docs/MANYCHAT-MUTUAL-DM.md).
# Invoked by pg_cron or a Database Webhook, neither of which carries a JWT. Same
# posture as celestual-notify: it drains a queue only a real match can fill, and
# answers with counts, so triggering it reveals nothing and sends nothing that
# wasn't already owed to the person receiving it.
[functions.celestual-mutual-dm]
verify_jwt = false

# School (.edu) email verification. Invoked by anonymous visitors (with the anon
# key) from the join sheet, so JWT verification is off; the function enforces its
# own domain check, per-address rate limit, and code-hash comparison instead.
[functions.celestual-edu-verify]
verify_jwt = false

# Durable, DM-free re-login (the email magic link). Invoked by anonymous visitors
# (with the anon key) from the sign-back-in flow and the /signin redeem, so JWT
# verification is off; identity rests on the one-time emailed token + the
# proof-gated binding, both enforced in service-role-only RPCs.
[functions.celestual-relogin]
verify_jwt = false

# The First Light trial's front door (celestual.us/trial). Invoked by anonymous
# visitors (with the anon key), so JWT verification is off; identity rests on
# the emailed one-time code, checked server-side against its stored hash.
[functions.celestual-trial]
verify_jwt = false

# The admin desk (celestual.us/admin). Invoked from the admin page with the anon
# key, so JWT verification is off; every request carries the admin password,
# checked server-side (CELESTUAL_ADMIN_PASSWORD), and wrong tries are rate
# limited per IP.
[functions.celestual-admin]
verify_jwt = false

# The paid door (migration 0021, docs/STRIPE-SETUP.md). Invoked from Screen 9 with
# the anon key, so JWT verification is off; buying anything requires the same
# Instagram-DM ownership proof placing a ping requires, checked server-side in
# celestual_billing_begin.
[functions.celestual-stripe]
verify_jwt = false

# Stripe's webhook. JWT verification MUST stay off here: Stripe cannot send a
# Supabase JWT, and this endpoint's authentication is the Stripe signature, which
# the function verifies itself (HMAC-SHA256 over "<timestamp>.<raw body>",
# constant-time, five-minute tolerance) before reading a single field. Deploy it
# with `--no-verify-jwt` too.
[functions.celestual-stripe-webhook]
verify_jwt = false

# The handle resolver (migration 0028, docs/HANDLE-RESOLVER.md). Invoked by
# anonymous visitors from every field where an @ is typed, and its avatar half
# is fetched by an <img> tag, which cannot carry an apikey header at all. So JWT
# verification is off; the function enforces its own per-device and per-IP caps
# instead, and answers only about a handle somebody already typed in full.
[functions.celestual-resolve]
verify_jwt = false
